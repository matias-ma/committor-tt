[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "committor"
version = "0.2.0"
description = "Committor functions via chebdGE Chebyshev tensor-train / Tucker approximations, with Ginzburg-Landau as the flagship example"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matias Andia", email = "mati@princeton.edu" },
]
keywords = [
    "committor",
    "tensor train",
    "Tucker",
    "Chebyshev",
    "rare events",
    "stochastic processes",
    "cryo-EM",
    "Ginzburg-Landau",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "jax>=0.4.28",
    "equinox>=0.11",
    "optax>=0.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "chebttge>=0.1.0",
    "ftde>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
notebook = [
    "jupyter",
    "matplotlib>=3.5",
    "ipykernel",
]
all = [
    "committor[dev,notebook]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
