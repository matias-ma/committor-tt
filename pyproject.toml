[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "committor"
version = "0.1.0"
description = "Tensor-train committor functions (Chen, Hoskins, Khoo, Lindsey 2021)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chen, Hoskins, Khoo, Lindsey" },
]
keywords = ["committor", "tensor train", "MPS", "rare events", "stochastic processes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]
notebook = [
    "jupyter",
    "matplotlib>=3.5",
    "ipykernel",
]
all = [
    "committor[dev,notebook]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["committor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::UserWarning",   # suppress expected ALS basis warnings in tests
]

[tool.coverage.run]
source = ["committor"]
omit = ["tests/*"]